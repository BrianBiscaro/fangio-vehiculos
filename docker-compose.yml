version: '3.8'

services:
  # 1. Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: fangio_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: fangio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fangio_network

  # 2. Backend Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fangio_backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/fangio_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update 
    networks:
      - fangio_network

  # 3. Frontend React (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fangio_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fangio_network

volumes:
  postgres_data:

networks:
  fangio_network:
    driver: bridge